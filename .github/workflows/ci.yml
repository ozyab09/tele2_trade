name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project + dev dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Verify package imports and CLI entry points
        run: |
          python -m tele2_trade --help
          python -c "import tele2_trade; print(tele2_trade.__version__)"

      - name: Verify Docker image builds
        run: docker build -t tele2-trade:ci .